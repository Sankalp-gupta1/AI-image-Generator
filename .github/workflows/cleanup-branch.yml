name: One-time branch cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-branch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged upgrade branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE repos/${{ github.repository }}/git/refs/heads/upgrade/genvision-studio || true
